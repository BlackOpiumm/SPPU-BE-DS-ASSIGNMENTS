<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Distributed Calculator</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #312e81
            );

            overflow:hidden;
        }

        .background-glow{
            position:absolute;
            width:500px;
            height:500px;
            background:#7c3aed;
            border-radius:50%;
            filter:blur(120px);
            opacity:0.35;
            top:-120px;
            left:-100px;
        }

        .background-glow2{
            position:absolute;
            width:400px;
            height:400px;
            background:#06b6d4;
            border-radius:50%;
            filter:blur(120px);
            opacity:0.3;
            bottom:-100px;
            right:-80px;
        }

        .calculator{

            position:relative;
            z-index:10;

            width:560px;

            background:rgba(255,255,255,0.08);

            border:1px solid rgba(255,255,255,0.15);

            backdrop-filter:blur(20px);

            border-radius:28px;

            padding:25px;

            box-shadow:
            0 10px 40px rgba(0,0,0,0.4);
        }

        .title{
            text-align:center;
            color:white;
            font-size:28px;
            font-weight:700;
            margin-bottom:20px;
            letter-spacing:1px;
        }

        .display{

            width:100%;
            height:90px;

            background:rgba(255,255,255,0.12);

            border:none;

            border-radius:18px;

            color:white;

            text-align:right;

            padding:20px;

            font-size:34px;

            margin-bottom:22px;

            outline:none;

            box-shadow:
            inset 0 4px 12px rgba(0,0,0,0.25);
        }

        .buttons{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:14px;
        }

        button{

            height:70px;

            border:none;

            border-radius:18px;

            font-size:24px;

            cursor:pointer;

            transition:0.2s ease;

            color:white;

            background:rgba(255,255,255,0.08);

            backdrop-filter:blur(10px);

            box-shadow:
            0 6px 12px rgba(0,0,0,0.2);
        }

        button:hover{
            transform:translateY(-3px);
        }

        button:active{
            transform:scale(0.96);
        }

        .operator{
            background:
            linear-gradient(
                135deg,
                #8b5cf6,
                #6366f1
            );
        }

        .equal{
            background:
            linear-gradient(
                135deg,
                #06b6d4,
                #3b82f6
            );
        }

        .clear{
            background:
            linear-gradient(
                135deg,
                #ef4444,
                #f97316
            );
        }

        .zero{
            grid-column:span 2;
        }

        .footer{
            margin-top:18px;
            text-align:center;
            color:#cbd5e1;
            font-size:13px;
        }

    </style>
</head>

<body>

    <div class="background-glow"></div>
    <div class="background-glow2"></div>

    <div class="calculator">

        <div class="title">
            Smart Calculator
        </div>

        <input
            type="text"
            class="display"
            id="display"
            disabled
        />

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">
                C
            </button>

            <button onclick="appendValue('(')">
                (
            </button>

            <button onclick="appendValue(')')">
                )
            </button>

            <button class="operator" onclick="appendValue('/')">
                ÷
            </button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>

            <button class="operator" onclick="appendValue('*')">
                ×
            </button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>

            <button class="operator" onclick="appendValue('-')">
                −
            </button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>

            <button class="operator" onclick="appendValue('+')">
                +
            </button>

            <button class="zero" onclick="appendValue('0')">
                0
            </button>

            <button onclick="appendValue('.')">
                .
            </button>

            <button class="equal" onclick="calculate()">
                =
            </button>

        </div>

        <div class="footer">
            Distributed Systems Calculator
        </div>

    </div>

    <script>

        const display =
            document.getElementById("display");

        // Add value
        function appendValue(value){

            display.value += value;
        }

        // Clear display
        function clearDisplay(){

            display.value = "";
        }

        // Calculate
        async function calculate(){

            try{

                let expression =
                    display.value.trim();

                // Strict binary expression
                const pattern =
                    /^\s*(-?\d+(\.\d+)?)\s*([\+\-\*\/])\s*(-?\d+(\.\d+)?)\s*$/;

                const match =
                    expression.match(pattern);

                // Invalid expression
                if(!match){

                    display.value = "Error";

                    return;
                }

                let num1 =
                    parseFloat(match[1]);

                let operator =
                    match[3];

                let num2 =
                    parseFloat(match[4]);

                let operation = "";

                // Map operators
                if(operator === "+")
                    operation = "add";

                else if(operator === "-")
                    operation = "subtract";

                else if(operator === "*")
                    operation = "multiply";

                else if(operator === "/")
                    operation = "divide";

                // Divide by zero
                if(operation === "divide"
                    && num2 === 0){

                    display.value =
                        "Cannot Divide by 0";

                    return;
                }

                const formData =
                    new FormData();

                formData.append(
                    "num1",
                    num1
                );

                formData.append(
                    "num2",
                    num2
                );

                formData.append(
                    "operation",
                    operation
                );

                const response =
                    await fetch(
                        "/calculate",
                        {
                            method:"POST",
                            body:formData
                        }
                    );

                const result =
                    await response.text();

                display.value = result;

            }

            catch(error){

                display.value = "Error";
            }
        }

    </script>

</body>
</html>
